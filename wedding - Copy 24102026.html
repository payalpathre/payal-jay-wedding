/* Elegant circular monogram */
#reveal {
  gap: 0;
}

#reveal .monogram-circle {
  width: clamp(280px, 58vw, 400px);
  aspect-ratio: 1 / 1;
  border: 2px solid rgba(214, 181, 109, 0.20);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 60px;
}

#reveal .mono {
  font-family: var(--font-serif);
  font-size: clamp(5rem, 16vw, 9rem);
  font-weight: 400;
  color: #E8B6A5;
  line-height: 1;
  letter-spacing: -0.06em;
  white-space: nowrap;
}

/* Style the ampersand separately */
#reveal .mono .amp {
  font-family: var(--font-script);
  font-size: 0.55em;
  color: #E6C568;
  display: inline-block;
  vertical-align: 0.05em;
  margin: 0 0.04em;
  letter-spacing: 0;
}

/* Refined invitation button */
#reveal #open-btn {
  background: transparent;
  border: 1px solid #D8B0A0;
  color: #D8B0A0;

  letter-spacing: 0.25em;

  background: rgba(214, 181, 109, 0.08);

}
.std-seal{
  width:140px;height:140px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#f0d99a,var(--gold) 45%,#8f6a28);

}

  0%{box-shadow:0 0 0 0 rgba(214,181,109,.5),0 10px 30px rgba(0,0,0,.45)}

}
.std-hint{letter-spacing:.3em;text-transform:uppercase;font-size:.75rem;color:var(--lavender)}

.std-open{
  text-align:center;outline:none;
  opacity:0;transform:scale(.92);visibility:hidden;
  transition:opacity .8s,transform .8s,visibility 0s .8s;
}
.std-card.revealed .std-closed{
  opacity:0;transform:scale(.8);visibility:hidden;pointer-events:none;
  transition:opacity .6s,transform .6s,visibility 0s .6s;
}
.std-card.revealed .std-open{
  opacity:1;transform:none;visibility:visible;

.std-count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px auto 24px;max-width:420px}
.std-count div{border:1px solid rgba(214,181,109,.4);border-radius:12px;padding:10px 4px;background:rgba(23,12,39,.45)}
.std-count b{display:block;font-family:var(--font-serif);font-size:clamp(1.5rem,6vw,2rem);color:var(--gold);font-weight:600;line-height:1.1}
.std-count span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--lavender)}

.spark{
  position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);border-radius:50%;
  background:var(--gold);pointer-events:none;
  animation:spark 1.2s ease-out forwards;
}
@keyframes spark{
  from{transform:translate(-50%,-50%) scale(1);opacity:1}
  to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2);opacity:0}
}

function stdTick() {
  const ms = wd - Date.now();
  if (ms <= 0) { $("#std-count").innerHTML = `<p class="std-done">The celebrations have begun!</p>`; return false; }
  const s = Math.floor(ms / 1000);
  const parts = [["Days", Math.floor(s / 86400)], ["Hours", Math.floor(s % 86400 / 3600)], ["Mins", Math.floor(s % 3600 / 60)], ["Secs", s % 60]];
  $("#std-count").innerHTML = parts.map(([l, n]) => `<div><b>${String(n).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
  return true;
}
if (stdTick()) { const t = setInterval(() => { if (!stdTick()) clearInterval(t); }, 1000); }

function stdSparkle(host) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("i"), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 160;
    el.className = "spark";
    el.style.setProperty("--x", Math.cos(a) * d + "px");
    el.style.setProperty("--y", Math.sin(a) * d + "px");
    el.style.setProperty("--s", 4 + Math.random() * 6 + "px");
    host.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
}
/* Confetti burst (full-screen canvas, removes itself when finished) */
function stdConfetti(originEl) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const cv = document.createElement("canvas");
  cv.setAttribute("aria-hidden", "true");
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  const r = originEl.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const colors = ["#D6B56D", "#F0D99A", "#FFF8EE", "#C8B6E2", "#E8B6A5", "#B8924A", "#8E5BC9"];
  const bits = [];

  // Two bursts from the seal, plus a light shower from the top
  const burst = (n, delay) => setTimeout(() => {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;   // mostly upward fan
      const v = 7 + Math.random() * 9;
      bits.push({
        x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 5,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
        tilt: Math.random() * 6.28, vt: 0.08 + Math.random() * 0.15,
        c: colors[Math.random() * colors.length | 0], round: Math.random() < 0.25, life: 0
      });
    }
  }, delay);
  burst(90, 0); burst(60, 220);
  setTimeout(() => {
    for (let i = 0; i < 50; i++) bits.push({
      x: Math.random() * W, y: -20 - Math.random() * 120, vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2.5,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      tilt: Math.random() * 6.28, vt: 0.08 + Math.random() * 0.12,
      c: colors[Math.random() * colors.length | 0], round: Math.random() < 0.25, life: 0
    });
  }, 450);

  const start = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, W, H);
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.vy += 0.22; b.vx *= 0.985; b.vy *= 0.992;      // gravity + air drag
      b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.tilt += b.vt; b.life++;
      if (b.y > H + 30) { bits.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, (H + 30 - b.y) / 160, 1));
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.scale(1, Math.cos(b.tilt));                    // flutter
      ctx.fillStyle = b.c;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, 6.28); ctx.fill(); }
      else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }
    if ((bits.length || now - start < 700) && now - start < 7000) requestAnimationFrame(frame);
    else cv.remove();
  })(start);
}

/* Add-to-calendar (.ics download) */
function parseDateTime(dateStr, timeStr) {
  const d = new Date(`${dateStr} ${timeStr}`);
  return isNaN(d) ? new Date(C.weddingDate) : d;
}
const icsStamp = d => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
document.addEventListener("click", e => {
  const a = e.target.closest("[data-cal]"); if (!a) return;
  e.preventDefault();
  const ev = C.events.find(x => x.id === a.dataset.cal);
  const start = parseDateTime(ev.date, ev.time), end = new Date(start.getTime() + 3 * 3600e3);
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",
    `DTSTART:${icsStamp(start)}`,`DTEND:${icsStamp(end)}`,
    `SUMMARY:${ev.title} - ${C.couple.groom.short} & ${C.couple.bride.short}`,
    `LOCATION:${ev.venue}, ${ev.address}`,`DESCRIPTION:${ev.description}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  const l = document.createElement("a"); l.href = url; l.download = `${ev.id}.ics`; l.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

const form = $("#rsvp-form");
form.addEventListener("change", e => {
  if (e.target.name === "attending") $("#yes-only").classList.toggle("hidden", e.target.value !== "yes");
});
const setErr = (k, msg) => { const el = $(`.err[data-for="${k}"]`); if (el) el.textContent = msg || ""; };

form.addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(form);
  const data = {
    name: (fd.get("name") || "").trim(),
    attending: fd.get("attending"),
    guests: fd.get("attending") === "yes" ? +fd.get("guests") : 0,
    events: fd.get("attending") === "yes" ? fd.getAll("events") : [],
    message: (fd.get("message") || "").trim(),
    submittedAt: new Date().toISOString()
  };
  let ok = true;

setErr("name");
setErr("attending");

if (!data.name) {
  setErr("name", "Please enter your name.");
  ok = false;
}

if (!data.attending) {
  setErr("attending", "Please choose one.");
  ok = false;
}

if (!ok) return;

  const summary =
`RSVP for ${C.couple.bride.short} & ${C.couple.groom.short}
Name: ${data.name}
Attending: ${data.attending === "yes" ? "Yes" : "No"}` +
(data.attending === "yes" ? `
Guests: ${data.guests}
Events: ${data.events.join(", ") || "-"}` : "") +
(data.message ? `\nMessage: ${data.message}` : "");

  try {
    if (R.mode === "endpoint" && R.endpoint) {
  await fetch(R.endpoint, { 
    method: "POST", 
    mode: "no-cors", 
    headers: { "Content-Type": "text/plain" }, 
    body: JSON.stringify(data) 
  });
} else if (R.mode === "whatsapp" && R.whatsappNumber) {
      window.open(`https://wa.me/${R.whatsappNumber}?text=${encodeURIComponent(summary)}`, "_blank");
    } else if (R.mode === "email" && R.email) {
      location.href = `mailto:${R.email}?subject=${encodeURIComponent("Wedding RSVP - " + data.name)}&body=${encodeURIComponent(summary)}`;
    }
    // Always keep a local copy (view with: JSON.parse(localStorage.rsvps))
    try {
      const all = JSON.parse(localStorage.getItem("rsvps") || "[]"); all.push(data);
      localStorage.setItem("rsvps", JSON.stringify(all));
    } catch (_) {}
  } catch (err) {
    setErr("attending", "Could not send. Please try again.");
    return;
  }
  $("#rsvp-ok-text").textContent = data.attending === "yes" ? R.thanksYes : R.thanksNo;
  form.style.display = "none"; $("#rsvp-ok").style.display = "block";
});
$("#rsvp-again").onclick = () => {
  form.reset(); $("#yes-only").classList.add("hidden");
  form.style.display = "grid"; $("#rsvp-ok").style.display = "none";
};

document.querySelectorAll(".fade").forEach(el => io.observe(el));
